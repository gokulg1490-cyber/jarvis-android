name: Build JARVIS Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract the intended JARVIS ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find . -type f -name 'JARVIS-Android-Upload-Ready*.zip' -not -path './.git/*' | sort | head -n 1)"
          if [ -z "$ARCHIVE" ]; then
            echo "JARVIS-Android-Upload-Ready.zip is missing. Upload that ZIP to the repository root first."
            exit 1
          fi
          echo "Using archive: $ARCHIVE"
          mkdir -p "$GITHUB_WORKSPACE/jarvis-build-source"
          unzip -oq "$ARCHIVE" -d "$GITHUB_WORKSPACE/jarvis-build-source"

          SETTINGS="$(find "$GITHUB_WORKSPACE/jarvis-build-source" -type f -name settings.gradle.kts | head -n 1)"
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts was not found inside the ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "app/build.gradle.kts was not found inside the ZIP."
            exit 1
          fi

          # Explicitly force Java compile tasks to JVM 17 as well as the Android DSL.
          cat >> "$PROJECT_DIR/app/build.gradle.kts" <<'GRADLE'

          tasks.withType<org.gradle.api.tasks.compile.JavaCompile>().configureEach {
              sourceCompatibility = "17"
              targetCompatibility = "17"
          }
          GRADLE

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using Android project: $PROJECT_DIR"
          grep -nE 'VERSION_17|jvmTarget|sourceCompatibility|targetCompatibility' "$PROJECT_DIR/app/build.gradle.kts"

      - name: Build APK
        run: gradle --no-daemon -p "${{ steps.project.outputs.project_dir }}" clean :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-debug
          path: jarvis-build-source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
