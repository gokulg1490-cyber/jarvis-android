name: Build JARVIS Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract the uploaded JARVIS project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/jarvis-project"

          # Prefer the exact project ZIP supplied for this build.
          ZIP=""
          if [ -f "JARVIS-Android-Upload-Ready.zip" ]; then
            ZIP="JARVIS-Android-Upload-Ready.zip"
          else
            while IFS= read -r -d '' candidate; do
              if unzip -Z1 "$candidate" | grep -Eq '(^|/)settings\.gradle\.kts$' &&
                 unzip -Z1 "$candidate" | grep -Eq '(^|/)app/build\.gradle\.kts$'; then
                ZIP="$candidate"
                break
              fi
            done < <(find . -type f -iname '*.zip' -not -path './.git/*' -print0)
          fi

          if [ -z "$ZIP" ]; then
            echo "No Android project ZIP found in the repository root or subfolders."
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          unzip -oq "$ZIP" -d "$GITHUB_WORKSPACE/jarvis-project"

          SETTINGS="$(find "$GITHUB_WORKSPACE/jarvis-project" -type f -name settings.gradle.kts | head -n 1)"
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts missing after extraction."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "app/build.gradle.kts missing from extracted project."
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify Java and Kotlin targets
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking app/build.gradle.kts"
          grep -n -A4 -B2 'compileOptions\|kotlinOptions\|jvmTarget' app/build.gradle.kts
          grep -q 'sourceCompatibility = JavaVersion.VERSION_17' app/build.gradle.kts
          grep -q 'targetCompatibility = JavaVersion.VERSION_17' app/build.gradle.kts
          grep -q 'jvmTarget = "17"' app/build.gradle.kts
          echo "Java and Kotlin targets are both set to 17."

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-debug
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
