name: Build JARVIS Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find the correct JARVIS ZIP and extract it
        id: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/jarvis-project"
          SELECTED=""

          # Prefer a ZIP whose app/build.gradle.kts already declares both JVM targets as 17.
          while IFS= read -r -d '' archive; do
            listing="$(unzip -Z1 "$archive")"
            settings_path="$(printf '%s\n' "$listing" | grep -E '(^|/)settings\.gradle\.kts$' | head -n 1 || true)"
            app_path="$(printf '%s\n' "$listing" | grep -E '(^|/)app/build\.gradle\.kts$' | head -n 1 || true)"
            if [ -z "$settings_path" ] || [ -z "$app_path" ]; then
              continue
            fi

            tempdir="$(mktemp -d)"
            unzip -oq "$archive" "$app_path" -d "$tempdir"
            gradle_file="$tempdir/$app_path"
            if grep -q 'sourceCompatibility = JavaVersion.VERSION_17' "$gradle_file" &&
               grep -q 'targetCompatibility = JavaVersion.VERSION_17' "$gradle_file" &&
               grep -q 'jvmTarget = "17"' "$gradle_file"; then
              SELECTED="$archive"
              rm -rf "$tempdir"
              break
            fi
            rm -rf "$tempdir"
          done < <(find . -type f -iname '*.zip' -not -path './.git/*' -print0)

          # If none already has the correct declarations, use the first structurally valid Android ZIP.
          if [ -z "$SELECTED" ]; then
            while IFS= read -r -d '' archive; do
              listing="$(unzip -Z1 "$archive")"
              if printf '%s\n' "$listing" | grep -Eq '(^|/)settings\.gradle\.kts$' &&
                 printf '%s\n' "$listing" | grep -Eq '(^|/)app/build\.gradle\.kts$'; then
                SELECTED="$archive"
                break
              fi
            done < <(find . -type f -iname '*.zip' -not -path './.git/*' -print0)
          fi

          if [ -z "$SELECTED" ]; then
            echo "No ZIP containing settings.gradle.kts and app/build.gradle.kts was found."
            exit 1
          fi

          echo "Selected project ZIP: $SELECTED"
          unzip -oq "$SELECTED" -d "$GITHUB_WORKSPACE/jarvis-project"

          settings_file="$(find "$GITHUB_WORKSPACE/jarvis-project" -type f -name settings.gradle.kts | head -n 1)"
          project_dir="$(dirname "$settings_file")"
          test -f "$project_dir/app/build.gradle.kts"
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"

      - name: Normalize Java and Kotlin targets to 17
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          # Replace existing Java 8/other compatibility declarations.
          s = re.sub(
              r'sourceCompatibility\s*=\s*(?:JavaVersion\.VERSION_[A-Z0-9_]+|"[^"]+"|\'[^\']+\')',
              'sourceCompatibility = JavaVersion.VERSION_17',
              s
          )
          s = re.sub(
              r'targetCompatibility\s*=\s*(?:JavaVersion\.VERSION_[A-Z0-9_]+|"[^"]+"|\'[^\']+\')',
              'targetCompatibility = JavaVersion.VERSION_17',
              s
          )

          # Ensure an Android compileOptions block exists and contains both values.
          if re.search(r'compileOptions\s*\{', s):
              block = re.search(r'compileOptions\s*\{([^}]*)\}', s, re.S)
              body = block.group(1)
              if 'sourceCompatibility' not in body:
                  body += '\n        sourceCompatibility = JavaVersion.VERSION_17'
              if 'targetCompatibility' not in body:
                  body += '\n        targetCompatibility = JavaVersion.VERSION_17'
              s = s[:block.start(1)] + body + s[block.end(1):]
          else:
              android = re.search(r'android\s*\{', s)
              if not android:
                  raise SystemExit("No android { } block found in app/build.gradle.kts")
              insert = '\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n'
              s = s[:android.end()] + insert + s[android.end():]

          # Set the existing Kotlin Android DSL kotlinOptions block; do not add a
          # top-level kotlinOptions block (that is invalid in this project).
          kotlin = re.search(r'kotlinOptions\s*\{([^}]*)\}', s, re.S)
          if kotlin:
              body = kotlin.group(1)
              if re.search(r'jvmTarget\s*=', body):
                  body = re.sub(r'jvmTarget\s*=\s*("[^"]*"|\'[^\']*\')', 'jvmTarget = "17"', body)
              else:
                  body += '\n        jvmTarget = "17"\n'
              s = s[:kotlin.start(1)] + body + s[kotlin.end(1):]
          else:
              android_end = s.rfind('}')
              s = s[:android_end] + '\n    kotlinOptions {\n        jvmTarget = "17"\n    }\n' + s[android_end:]

          p.write_text(s)
          print("Normalized app/build.gradle.kts:")
          print(s)
          PY

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-debug
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
