
name: Build JARVIS Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'JARVIS-Android-Starter.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Extract project
        run: |
          mkdir -p work
          unzip -q JARVIS-Android-Starter.zip -d work
          PROJECT_DIR=$(find work -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Maven mirror
        run: |
          cat > "$RUNNER_TEMP/maven-mirror.init.gradle" <<'EOF'
          gradle.beforeSettings { settings ->
              settings.pluginManagement.repositories {
                  maven {
                      url = uri("https://maven.wso2.org/nexus/content/repositories/central/")
                  }
              }
              settings.dependencyResolutionManagement.repositories {
                  maven {
                      url = uri("https://maven.wso2.org/nexus/content/repositories/central/")
                  }
              }
          }
          gradle.beforeProject { project ->
              project.buildscript.repositories {
                  maven {
                      url = uri("https://maven.wso2.org/nexus/content/repositories/central/")
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --init-script "$RUNNER_TEMP/maven-mirror.init.gradle" assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-APK
          path: work/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
