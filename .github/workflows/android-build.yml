name: Build JARVIS Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract the Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/jarvis-source"
          PROJECT_DIR=""

          SETTINGS="$(find . -type f -name settings.gradle.kts -not -path './.git/*' | head -n 1 || true)"
          if [ -n "$SETTINGS" ]; then
            CANDIDATE="$(dirname "$SETTINGS")"
            if [ -f "$CANDIDATE/app/build.gradle.kts" ]; then
              PROJECT_DIR="$CANDIDATE"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r -d '' ARCHIVE; do
              if unzip -Z1 "$ARCHIVE" | grep -Eq '(^|/)settings\.gradle\.kts$' &&
                 unzip -Z1 "$ARCHIVE" | grep -Eq '(^|/)app/build\.gradle\.kts$'; then
                echo "Using Android project archive: $ARCHIVE"
                unzip -oq "$ARCHIVE" -d "$GITHUB_WORKSPACE/jarvis-source"
                SETTINGS="$(find "$GITHUB_WORKSPACE/jarvis-source" -type f -name settings.gradle.kts | head -n 1 || true)"
                if [ -n "$SETTINGS" ]; then
                  CANDIDATE="$(dirname "$SETTINGS")"
                  if [ -f "$CANDIDATE/app/build.gradle.kts" ]; then
                    PROJECT_DIR="$CANDIDATE"
                    break
                  fi
                fi
              fi
            done < <(find . -type f -iname '*.zip' -not -path './.git/*' -print0)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "No valid Android project found. The repository needs app/build.gradle.kts and settings.gradle.kts, either directly or inside a ZIP."
            find . -maxdepth 5 -type f | sort | head -250
            exit 1
          fi

          echo "Android project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Force Java and Kotlin JVM targets to 17
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s += """

          tasks.withType<org.gradle.api.tasks.compile.JavaCompile>().configureEach {
              sourceCompatibility = "17"
              targetCompatibility = "17"
          }
          """
          p.write_text(s)
          print("Forced Java compile task targets to 17")
          PY

      - name: Build APK
        run: gradle --no-daemon -p "${{ steps.project.outputs.project_dir }}" clean :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-debug
          path: |
            **/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
